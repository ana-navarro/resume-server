services:
  resume-app:
    build: ../apps/resume-app
    volumes:
      - ../apps/resume-app:/app
      - resume-app-node-modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "5173:5173"

  resume-bff:
    build: ../services/resume-bff
    volumes:
      - ../services/resume-bff:/app
    ports:
      - "8001:8000"

  resume-orchestrator:
    build: ../services/resume-orchestrator
    volumes:
      - ../services/resume-orchestrator:/app
    env_file:
      - ../services/resume-orchestrator/.env
    ports:
      - "8002:8000"

  resume-injections:
    build: ../services/resume-injections
    volumes:
      - ../services/resume-injections:/app
    env_file:
      - ../services/resume-injections/.env
    ports:
      - "8003:8000"

  resume-embeddings:
    build: ../services/resume-embeddings
    volumes:
      - ../services/resume-embeddings:/app
    env_file:
      - ../services/resume-embeddings/.env
    ports:
      - "8004:8000"

  resume-llm-engine:
    build: ../services/resume-llm-engine
    volumes:
      - ../services/resume-llm-engine:/app
    ports:
      - "8005:8000"

  resume-guard-rails:
    build: ../services/resume-guard-rails
    volumes:
      - ../services/resume-guard-rails:/app
    ports:
      - "8006:8000"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - resume-app
      - resume-bff
      - resume-orchestrator
      - resume-injections
      - resume-embeddings
      - resume-llm-engine
      - resume-guard-rails

  auto-updater:
    image: alpine/git
    volumes:
      - ..:/workspace
    working_dir: /workspace
    entrypoint: ["sh", "/workspace/resume-server/scripts/auto-update.sh"]

volumes:
  resume-app-node-modules:
