events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream resume_app {
    server resume-app:5173;
  }

  upstream resume_bff {
    server resume-bff:8000;
  }

  upstream resume_orchestrator {
    server resume-orchestrator:8000;
  }

  server {
    listen 80;

    # resume-bff: BFF público consumido pelo frontend (Constitution Principle II:
    # Frontend -> bff -> orchestrator -> demais serviços).
    location /bff/ {
      proxy_pass http://resume_bff/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # resume-orchestrator: hospeda os endpoints públicos de upload/auditoria de
    # features/injection/rules.md (POST /presentation, POST /curriculo, /audit).
    location /orchestrator/ {
      proxy_pass http://resume_orchestrator/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # resume-app: frontend Vite, com suporte a WebSocket para o HMR em dev.
    location / {
      proxy_pass http://resume_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
