events {}

http {
  # Docker's embedded DNS server (127.0.0.11 on any user-defined bridge network, which
  # docker-compose creates automatically). Combined with variables in proxy_pass below, this
  # defers hostname resolution to request time instead of config-load time -- required both so
  # `nginx -t` doesn't fail when the other containers aren't present (e.g. this repo's own CI,
  # which only has nginx.conf, not the full compose stack) and so nginx survives a backend
  # container restarting with a new IP without needing a reload.
  resolver 127.0.0.11 valid=10s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;

    # resume-bff: BFF público consumido pelo frontend (Constitution Principle II:
    # Frontend -> bff -> orchestrator -> demais serviços).
    location /bff/ {
      set $upstream_bff resume-bff:8000;
      proxy_pass http://$upstream_bff/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # resume-orchestrator: hospeda os endpoints públicos de upload/auditoria de
    # features/injection/rules.md (POST /presentation, POST /curriculo, /audit).
    location /orchestrator/ {
      set $upstream_orchestrator resume-orchestrator:8000;
      proxy_pass http://$upstream_orchestrator/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # resume-app: frontend Vite, com suporte a WebSocket para o HMR em dev.
    location / {
      set $upstream_app resume-app:5173;
      proxy_pass http://$upstream_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
